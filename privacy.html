<title>Informativa privacy · Transfer Alpstay</title>

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--gold:#A68A63;--gold-line:#CBAE68;--gold-wash:#FAF4E9;--ink:#2E2F2E;--ink-soft:#4A4742;
        --field-border:#E6DEC8;--muted:#A79E8C;--err:#C45D5D}
  body{background:#fff;color:var(--ink);font-family:'Lato',sans-serif;font-weight:300;line-height:1.75;-webkit-font-smoothing:antialiased}
  .topbar{height:4px;background:linear-gradient(90deg,#A68A63,#F0DBBC 50%,#A68A63)}
  .wrap{max-width:820px;margin:0 auto;padding:40px 22px 70px}
  .logo{display:block;margin:0 auto 26px;height:84px;width:auto;max-width:80%;object-fit:contain}
  .langbar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:18px}
  .langbtn{background:none;border:1px solid var(--field-border);color:var(--muted);border-radius:3px;
    padding:5px 11px;font-size:12px;font-family:inherit;cursor:pointer}
  .langbtn.active{border-color:var(--gold);color:var(--gold)}
  h1{font-family:'Belleza',sans-serif;font-weight:400;font-size:clamp(28px,5vw,40px);letter-spacing:2px;
     text-transform:uppercase;text-align:center;line-height:1.15}
  .sub{text-align:center;color:var(--ink-soft);font-size:15px;margin-top:12px}
  .rule{width:64px;height:1px;background:var(--gold-line);margin:26px auto 34px}
  h2{font-family:'Belleza',sans-serif;font-weight:400;font-size:21px;letter-spacing:.06em;text-transform:uppercase;
     color:var(--ink);margin:34px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--field-border)}
  p{font-size:15px;color:var(--ink-soft);margin-bottom:12px}
  ul{margin:0 0 14px 20px}
  li{font-size:15px;color:var(--ink-soft);margin-bottom:6px}
  strong{color:var(--ink);font-weight:700}
  .box{border:1px solid var(--field-border);border-left:4px solid var(--gold);background:var(--gold-wash);
    border-radius:3px;padding:16px 18px;margin:16px 0}
  .box p{margin-bottom:6px}
  .manca{color:var(--err);font-weight:700}
  .avviso{border:1px solid var(--err);border-left:5px solid var(--err);background:#FBF1F0;border-radius:3px;
    padding:16px 18px;margin-bottom:28px}
  .avviso p{color:var(--err);margin:0;font-size:14px}
  a{color:var(--gold)}
  footer{border-top:1px solid var(--field-border);margin-top:44px;padding-top:22px;text-align:center;
    font-size:12px;color:var(--muted);line-height:1.9}
  .back{display:inline-block;margin-top:16px;border:1px solid var(--field-border);color:var(--ink-soft);
    text-decoration:none;text-transform:uppercase;letter-spacing:.12em;font-size:12px;padding:11px 22px;border-radius:2px}
  @media(max-width:680px){ .wrap{padding:28px 16px 50px} .logo{height:68px} }
</style>
</head>

<script>
const TESTI = {"it": {"titolo": "Informativa privacy", "sub": "Trattamento dei dati personali nel servizio di prenotazione transfer · artt. 13-14 Regolamento UE 2016/679 (GDPR)", "agg": "Ultimo aggiornamento", "incompleta": "Questa informativa non è ancora completa: mancano i dati identificativi del titolare. Compilali nel file della pagina prima di renderla pubblica.", "back": "Torna alla prenotazione", "sezioni": [["Chi tratta i tuoi dati", "<p>Il servizio di prenotazione coinvolge due soggetti, ciascuno titolare autonomo per la parte di propria competenza.</p><div class=\"box\" id=\"boxTitolari\"></div><p>Per qualsiasi questione relativa ai tuoi dati puoi scrivere a entrambi gli indirizzi indicati sopra.</p>"], ["Quali dati raccogliamo", "<p>Quando compili il modulo di richiesta raccogliamo:</p><ul><li>nome e cognome del passeggero;</li><li>indirizzo email e numero di telefono;</li><li>struttura Alpstay di riferimento;</li><li>data, orario, luogo di partenza e di arrivo;</li><li>numero del volo o del treno, se lo indichi;</li><li>numero di passeggeri, bagagli e attrezzatura sportiva;</li><li>le note che scrivi tu (per esempio la richiesta di un seggiolino).</li></ul><p>Durante la gestione della prenotazione si aggiungono il codice della richiesta, lo stato, il prezzo proposto e quello accettato, la data della tua conferma o del tuo rifiuto, e una copia del testo delle condizioni generali che hai accettato.</p><p>Non ti chiediamo dati relativi alla salute o altre categorie particolari: ti preghiamo di non inserirne nel campo note.</p>"], ["Perché li trattiamo", "<p><strong>Per gestire la richiesta, inviarti l'offerta ed eseguire il transfer.</strong> Base giuridica: esecuzione di un contratto e di misure precontrattuali richieste da te (art. 6.1.b GDPR). I dati contrassegnati come obbligatori sono necessari: senza di essi la prenotazione non può essere gestita.</p><p><strong>Per conservare la prova di ciò che hai accettato</strong> — prezzo e condizioni — e poter gestire eventuali contestazioni. Base giuridica: legittimo interesse a far valere o difendere un diritto (art. 6.1.f GDPR).</p><p><strong>Per adempiere agli obblighi fiscali e contabili.</strong> Base giuridica: obbligo legale (art. 6.1.c GDPR).</p><p>Non inviamo comunicazioni commerciali, non profiliamo e non prendiamo decisioni automatizzate sul tuo conto.</p>"], ["A chi comunichiamo i dati", "<p>I dati della prenotazione sono comunicati al vettore che esegue il trasporto, il quale li tratta come titolare autonomo.</p><p>Si avvalgono inoltre di fornitori tecnici che agiscono come responsabili del trattamento (art. 28 GDPR):</p><ul><li><strong>Google Ireland Ltd / Google LLC</strong> — archiviazione delle prenotazioni (Firebase Realtime Database), invio delle email di servizio (Google Apps Script e Gmail) e fornitura dei caratteri tipografici delle pagine (Google Fonts);</li><li><strong>GitHub Inc.</strong> — pubblicazione delle pagine web (GitHub Pages).</li></ul><p>I dati possono inoltre essere comunicati al consulente fiscale e, se necessario, a consulenti legali. Non sono diffusi né ceduti a terzi per finalità proprie.</p>"], ["Trasferimenti fuori dall'Unione europea", "<p>Alcuni dei fornitori indicati sopra hanno sede negli Stati Uniti o possono trattare i dati fuori dallo Spazio economico europeo. I trasferimenti avvengono sulla base della decisione di adeguatezza UE-USA (EU-US Data Privacy Framework) per le società certificate e, in via ulteriore, delle Clausole contrattuali standard approvate dalla Commissione europea.</p><p>Nota tecnica: le pagine caricano i caratteri tipografici dai server di Google; per effetto di ciò il tuo indirizzo IP viene comunicato a Google nel momento in cui apri la pagina.</p>"], ["Per quanto tempo li conserviamo", "<ul><li>dati della prenotazione e prova dell'accettazione: <strong>24 mesi</strong> dalla data del servizio, per gestire eventuali contestazioni;</li><li>documenti con rilevanza fiscale: <strong>10 anni</strong>, come previsto dalla legge;</li><li>richieste che non si sono concluse con un servizio: <strong>12 mesi</strong>.</li></ul><p>Scaduti i termini i dati sono cancellati o resi anonimi.</p>"], ["I tuoi diritti", "<p>Puoi chiedere in ogni momento l'accesso ai tuoi dati, la loro rettifica o cancellazione, la limitazione del trattamento, la portabilità, e puoi opporti al trattamento fondato sul legittimo interesse.</p><p>Per esercitare questi diritti scrivi agli indirizzi indicati al punto 1: riceverai risposta entro un mese.</p><p>Se ritieni che il trattamento violi il Regolamento puoi proporre reclamo al <a href=\"https://www.garanteprivacy.it\" target=\"_blank\" rel=\"noopener\">Garante per la protezione dei dati personali</a> o all'autorità di controllo dello Stato in cui risiedi.</p>"], ["Cookie", "<p>Questo sito <strong>non utilizza cookie di profilazione</strong>, non traccia la navigazione e non installa cookie di terze parti a scopo pubblicitario o statistico. Per questo motivo non viene richiesto alcun consenso tramite banner.</p><p>Gli unici collegamenti verso l'esterno sono quelli tecnici necessari al funzionamento del servizio, descritti al punto 4.</p>"], ["Modifiche", "<p>Eventuali aggiornamenti di questa informativa sono pubblicati su questa pagina, con l'indicazione della data di ultimo aggiornamento riportata in alto.</p>"]], "etVettore": "Servizio di trasporto prestato da", "etGestore": "Piattaforma di prenotazione gestita da", "daCompilare": "dato mancante"}, "de": {"titolo": "Datenschutzerklärung", "sub": "Verarbeitung personenbezogener Daten im Transfer-Buchungsdienst · Art. 13-14 Verordnung (EU) 2016/679 (DSGVO)", "agg": "Letzte Aktualisierung", "incompleta": "Diese Erklärung ist noch unvollständig: Die Angaben zum Verantwortlichen fehlen.", "back": "Zurück zur Buchung", "sezioni": [["Wer Ihre Daten verarbeitet", "<p>Am Buchungsdienst sind zwei Stellen beteiligt, jede davon eigenverantwortlich für ihren Bereich.</p><div class=\"box\" id=\"boxTitolariDe\"></div><p>Bei Fragen zu Ihren Daten können Sie sich an beide oben genannten Adressen wenden.</p>"], ["Welche Daten wir erheben", "<p>Über das Anfrageformular erheben wir: Vor- und Nachname des Fahrgasts, E-Mail-Adresse und Telefonnummer, die betreffende Alpstay-Unterkunft, Datum, Uhrzeit, Abhol- und Zielort, Flug- oder Zugnummer, Anzahl der Fahrgäste, Gepäckstücke und Sportausrüstung sowie Ihre Anmerkungen.</p><p>Hinzu kommen Buchungsnummer, Status, angebotener und akzeptierter Preis, Datum Ihrer Bestätigung oder Ablehnung sowie eine Kopie der von Ihnen akzeptierten allgemeinen Bedingungen.</p><p>Besondere Datenkategorien (z. B. Gesundheitsdaten) werden nicht erhoben; bitte geben Sie solche nicht im Feld für Anmerkungen an.</p>"], ["Zwecke und Rechtsgrundlagen", "<p><strong>Bearbeitung der Anfrage, Übermittlung des Angebots und Durchführung des Transfers.</strong> Rechtsgrundlage: Erfüllung eines Vertrags bzw. vorvertragliche Maßnahmen (Art. 6 Abs. 1 lit. b DSGVO). Ohne die als Pflichtfeld gekennzeichneten Daten ist keine Bearbeitung möglich.</p><p><strong>Nachweis des von Ihnen Akzeptierten</strong> (Preis und Bedingungen) zur Geltendmachung oder Abwehr von Ansprüchen. Rechtsgrundlage: berechtigtes Interesse (Art. 6 Abs. 1 lit. f DSGVO).</p><p><strong>Erfüllung steuer- und handelsrechtlicher Pflichten.</strong> Rechtsgrundlage: rechtliche Verpflichtung (Art. 6 Abs. 1 lit. c DSGVO).</p><p>Es erfolgen keine Werbesendungen, kein Profiling und keine automatisierten Entscheidungen.</p>"], ["Empfänger der Daten", "<p>Die Buchungsdaten werden an das ausführende Transportunternehmen übermittelt, das sie eigenverantwortlich verarbeitet.</p><p>Als Auftragsverarbeiter (Art. 28 DSGVO) sind tätig:</p><ul><li><strong>Google Ireland Ltd / Google LLC</strong> — Speicherung der Buchungen (Firebase Realtime Database), Versand der Service-E-Mails (Google Apps Script und Gmail) sowie Bereitstellung der Schriftarten (Google Fonts);</li><li><strong>GitHub Inc.</strong> — Bereitstellung der Webseiten (GitHub Pages).</li></ul><p>Eine Übermittlung an Steuer- und gegebenenfalls Rechtsberater ist möglich. Eine Weitergabe zu eigenen Zwecken Dritter erfolgt nicht.</p>"], ["Übermittlung außerhalb der EU", "<p>Einige der genannten Dienstleister haben ihren Sitz in den USA oder verarbeiten Daten außerhalb des EWR. Grundlage sind der Angemessenheitsbeschluss EU-USA (EU-US Data Privacy Framework) für zertifizierte Unternehmen sowie ergänzend die Standardvertragsklauseln der Europäischen Kommission.</p><p>Technischer Hinweis: Die Seiten laden die Schriftarten von Google-Servern; dabei wird Ihre IP-Adresse an Google übermittelt.</p>"], ["Speicherdauer", "<ul><li>Buchungsdaten und Nachweis der Annahme: <strong>24 Monate</strong> ab dem Servicedatum;</li><li>steuerlich relevante Unterlagen: <strong>10 Jahre</strong>;</li><li>Anfragen ohne zustande gekommenen Service: <strong>12 Monate</strong>.</li></ul><p>Nach Ablauf werden die Daten gelöscht oder anonymisiert.</p>"], ["Ihre Rechte", "<p>Sie haben jederzeit das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung und Datenübertragbarkeit sowie das Recht, der auf berechtigtem Interesse beruhenden Verarbeitung zu widersprechen.</p><p>Wenden Sie sich dazu an die unter Punkt 1 genannten Adressen; Sie erhalten innerhalb eines Monats Antwort.</p><p>Beschwerden können Sie bei der italienischen Datenschutzbehörde (<a href=\"https://www.garanteprivacy.it\" target=\"_blank\" rel=\"noopener\">Garante per la protezione dei dati personali</a>) oder bei der Aufsichtsbehörde Ihres Wohnsitzstaates einreichen.</p>"], ["Cookies", "<p>Diese Website verwendet <strong>keine Profiling-Cookies</strong>, verfolgt das Surfverhalten nicht und setzt keine Drittanbieter-Cookies zu Werbe- oder Statistikzwecken ein. Eine Einwilligung über ein Banner ist daher nicht erforderlich.</p><p>Die einzigen externen Verbindungen sind die unter Punkt 4 beschriebenen technisch notwendigen Dienste.</p>"], ["Änderungen", "<p>Aktualisierungen dieser Erklärung werden auf dieser Seite veröffentlicht; das Datum der letzten Aktualisierung ist oben angegeben.</p>"]], "etVettore": "Transportdienst erbracht von", "etGestore": "Buchungsplattform betrieben von", "daCompilare": "Angabe fehlt"}, "en": {"titolo": "Privacy policy", "sub": "Processing of personal data in the transfer booking service · Art. 13-14 Regulation (EU) 2016/679 (GDPR)", "agg": "Last updated", "incompleta": "This policy is not complete yet: the controller identification details are missing.", "back": "Back to booking", "sezioni": [["Who processes your data", "<p>Two parties are involved in the booking service, each acting as an independent controller for its own part.</p><div class=\"box\" id=\"boxTitolariEn\"></div><p>For any question about your data you may write to both addresses above.</p>"], ["What data we collect", "<p>Through the request form we collect: passenger first and last name, email address and phone number, the Alpstay property concerned, date, time, pick-up and drop-off locations, flight or train number, number of passengers, luggage and sports equipment, and any notes you write.</p><p>During processing we add the booking code, its status, the price offered and the price accepted, the date of your confirmation or refusal, and a copy of the general conditions you accepted.</p><p>We do not ask for health data or other special categories: please do not enter any in the notes field.</p>"], ["Why we process it", "<p><strong>To handle your request, send you the offer and carry out the transfer.</strong> Legal basis: performance of a contract and pre-contractual measures taken at your request (Art. 6.1.b GDPR). The data marked as required is necessary: without it the booking cannot be handled.</p><p><strong>To keep evidence of what you accepted</strong> — price and conditions — in order to handle any dispute. Legal basis: legitimate interest in establishing or defending a legal claim (Art. 6.1.f GDPR).</p><p><strong>To comply with tax and accounting obligations.</strong> Legal basis: legal obligation (Art. 6.1.c GDPR).</p><p>We send no marketing communications, carry out no profiling and take no automated decisions about you.</p>"], ["Who we share it with", "<p>Booking data is shared with the carrier performing the transport, which processes it as an independent controller.</p><p>The following technical providers act as processors (Art. 28 GDPR):</p><ul><li><strong>Google Ireland Ltd / Google LLC</strong> — booking storage (Firebase Realtime Database), service email delivery (Google Apps Script and Gmail) and web fonts (Google Fonts);</li><li><strong>GitHub Inc.</strong> — hosting of the web pages (GitHub Pages).</li></ul><p>Data may also be shared with our accountant and, where necessary, with legal advisers. It is never published or sold.</p>"], ["Transfers outside the European Union", "<p>Some of the providers listed above are based in the United States or may process data outside the European Economic Area. Transfers rely on the EU-US adequacy decision (EU-US Data Privacy Framework) for certified companies and, additionally, on the Standard Contractual Clauses approved by the European Commission.</p><p>Technical note: these pages load their fonts from Google servers, so your IP address is sent to Google when the page opens.</p>"], ["How long we keep it", "<ul><li>booking data and evidence of acceptance: <strong>24 months</strong> from the service date;</li><li>documents of tax relevance: <strong>10 years</strong>, as required by law;</li><li>requests that did not result in a service: <strong>12 months</strong>.</li></ul><p>After these periods the data is deleted or anonymised.</p>"], ["Your rights", "<p>You may at any time request access to your data, its rectification or erasure, restriction of processing and data portability, and you may object to processing based on legitimate interest.</p><p>To exercise these rights write to the addresses given in point 1; you will receive a reply within one month.</p><p>If you believe the processing breaches the Regulation you may lodge a complaint with the Italian supervisory authority (<a href=\"https://www.garanteprivacy.it\" target=\"_blank\" rel=\"noopener\">Garante per la protezione dei dati personali</a>) or with the authority of your country of residence.</p>"], ["Cookies", "<p>This site uses <strong>no profiling cookies</strong>, does not track your browsing and sets no third-party cookies for advertising or statistics. No consent banner is therefore required.</p><p>The only external connections are the technically necessary ones described in point 4.</p>"], ["Changes", "<p>Any update to this policy is published on this page, with the date of the last update shown above.</p>"]], "etVettore": "Transport service provided by", "etGestore": "Booking platform operated by", "daCompilare": "detail missing"}};

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function titolari(T){
  const riga = (etichetta, d) => {
    const manca = v => v ? esc(v) : '<span class="manca">[' + T.daCompilare + ']</span>';
    return '<p><strong>' + esc(etichetta) + '</strong><br>'
      + (d.ragioneSociale ? esc(d.ragioneSociale) : manca(d.ragioneSociale) + ' (' + esc(d.nome) + ')')
      + '<br>' + manca(d.sede)
      + '<br>P.IVA ' + manca(d.piva) + (d.rea ? ' · REA ' + esc(d.rea) : '')
      + '<br>' + esc(d.email) + (d.tel ? ' · ' + esc(d.tel) : '') + (d.web ? ' · ' + esc(d.web) : '') + '</p>';
  };
  return riga(T.etVettore, LEGALE.vettore) + riga(T.etGestore, LEGALE.gestore);
}

function completo(){
  const c = d => d.ragioneSociale && d.sede && d.piva;
  return c(LEGALE.vettore) && c(LEGALE.gestore);
}

function render(l){
  const T = TESTI[l] || TESTI.it;
  document.documentElement.lang = l;
  document.title = T.titolo + ' · Transfer Alpstay';
  let html = '<h1>' + esc(T.titolo) + '</h1><p class="sub">' + T.sub + '</p>'
    + '<p class="sub" style="font-size:13px;color:var(--muted)">' + esc(T.agg) + ': ' + esc(LEGALE.aggiornamento) + '</p>'
    + '<div class="rule"></div>';
  T.sezioni.forEach((s, i) => { html += '<h2>' + (i+1) + '. ' + esc(s[0]) + '</h2>' + s[1]; });
  document.getElementById('contenuto').innerHTML = html;
  const box = document.querySelector('#contenuto .box');
  if (box) box.innerHTML = titolari(T);
  document.getElementById('back').textContent = T.back;
  const av = document.getElementById('avviso');
  if (completo()) { av.style.display = 'none'; }
  else { av.style.display = 'block'; document.getElementById('avvisoTxt').textContent = T.incompleta; }
  document.querySelectorAll('.langbtn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
}

document.querySelectorAll('.langbtn').forEach(b =>
  b.addEventListener('click', () => render(b.dataset.lang)));

const url = new URLSearchParams(location.search).get('lang');
const auto = (navigator.language || 'it').slice(0,2).toLowerCase();
render(TESTI[url] ? url : (TESTI[auto] ? auto : 'it'));
</script>
</body>
